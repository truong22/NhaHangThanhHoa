        (function() {
            try {
                const path = window.location.pathname;
                if (path.endsWith('.html')) {
                    let clean = path.replace(/\.html$/, '');
                    window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
                }
            } catch(e) {}
        })();
    </script>

    <style>
        /* GRID LAYOUT CHO DANH SÁCH BÀN - GIỮ HÀNG LỐI THẲNG TẮP KHÔNG BỊ XÔ LỆCH */
        #tables-container {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 20px !important;
            margin: 0 !important;
            align-items: stretch !important;
        }
        #tables-container::before, #tables-container::after {
            display: none !important;
        }
        #tables-container > div[class*="col-"] {
            width: 100% !important;
            max-width: 100% !important;
            margin-bottom: 0 !important;
            padding: 0 !important;
            float: none !important;
            display: flex !important;
            flex-direction: column !important;
        }
        .table-card {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 0 !important;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            height: 100% !important;
            min-height: 200px !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            user-select: none;
            box-sizing: border-box !important;
        }
        @media (max-width: 1200px) {
            #tables-container {
                grid-template-columns: repeat(3, 1fr) !important;
            }
        }
        @media (max-width: 768px) {
            #tables-container {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
            }
        }
        @media (max-width: 480px) {
            #tables-container {
                grid-template-columns: 1fr !important;
            }
        }
        .table-card:hover, .table-card:active {
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            transform: translateY(-3px);
        }
        .table-empty {
            background-color: #f6fcf7;
            border-color: #28a745;
        }
        .table-empty h3 { color: #28a745; font-weight: 700; margin: 6px 0; }
        
        .table-occupied {
            background-color: #fff9e6;
            border-color: #f5a623;
        }
        .table-occupied h3 { color: #d97706; font-weight: 700; margin: 6px 0; }
        
        .table-reserved {
            background-color: #e6f9fc;
            border-color: #17a2b8;
        }
        .table-reserved h3 { color: #0e7490; font-weight: 700; margin: 6px 0; }
        
        .table-warning-res {
            background-color: #fffbe6 !important;
            border-color: #ff9800 !important;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.35) !important;
            animation: pulse-res-border 2.5s infinite;
        }
        @keyframes pulse-res-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }

        .table-icon {
            font-size: 38px;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            #top-header {
                display: none; /* Ẩn bớt thanh thông tin liên hệ phụ trên màn hình nhỏ để tăng diện tích hiển thị */
            }
            #header .header-logo h2 {
                font-size: 18px !important;
                margin: 8px 0 !important;
                text-align: center;
            }
            #header h3 {
                font-size: 16px !important;
                margin: 5px 0 !important;
                text-align: center;
            }
            .section {
                padding-top: 15px;
                padding-bottom: 20px;
            }
            .table-card {
                min-height: 120px;
                padding: 10px;
                margin-bottom: 12px;
                border-radius: 10px;
            }
            .table-icon {
                font-size: 28px;
                margin-bottom: 4px;
            }
            .table-card h3 {
                font-size: 16px;
            }
            .table-card p {
                font-size: 12px;
                margin: 0;
            }
        }
    </style>
</head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Custom POS JS -->
    <script>
        const API_BASE = '/api/v1';

        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return String(unsafe)
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            };
            const response = await fetch(API_BASE + url, { ...options, headers });
            if (response.status === 401 || response.status === 403) {
                alert("Bạn không có quyền hoặc phiên đăng nhập hết hạn!");
                window.location.href = '/login';
                throw new Error("Unauthorized");
            }
            return response.json();
        }

        async function setupAuthUI() {
            let fullName = localStorage.getItem('userFullName');
            const email = localStorage.getItem('userEmail');
            const userId = localStorage.getItem('userId');

            if (!fullName && userId) {
                try {
                    const uRes = await fetchWithAuth(`/users/${userId}`);
                    if (uRes && uRes.data && uRes.data.fullName) {
                        fullName = uRes.data.fullName;
                        localStorage.setItem('userFullName', fullName);
                    }
                } catch(e) {}
            }

            const authLinks = document.getElementById('auth-links');
            if(authLinks) {
                const displayName = fullName || email || 'Nhân viên';
                authLinks.innerHTML = `
                    <li><a href="#"><i class="fa fa-user-o"></i> ${escapeHtml(displayName)}</a></li>
                    <li><a href="#" onclick="logout(event)"><i class="fa fa-sign-out"></i> Đăng xuất</a></li>
                `;
            }
        }

        window.logout = function(e) {
            if(e) e.preventDefault();
            localStorage.clear();
            window.location.href = '/login';
        }

        let allTablesData = [];
        let allActiveOrdersData = [];
        let allReservationsData = [];

        async function loadTables() {
            try {
                const [tableRes, orderRes, resRes] = await Promise.all([
                    fetchWithAuth('/tables'),
                    fetchWithAuth('/orders/all'),
                    fetchWithAuth('/reservations/all')
                ]);
                
                const tables = tableRes.data || [];
                const allOrders = orderRes.data || [];
                allTablesData = tables;
                allReservationsData = resRes.data || [];
                const activeOrders = allOrders.filter(o => o.status !== 'COMPLETED' && o.status !== 'CANCELLED');
                allActiveOrdersData = activeOrders;

                const roles = JSON.parse(localStorage.getItem('userRoles') || '[]');
                const isCashierOrAdmin = roles.some(r => typeof r === 'string' && (r.toUpperCase().includes('ADMIN') || r.toUpperCase().includes('CASHIER')));
                
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const currentMinutes = now.getHours() * 60 + now.getMinutes();

                // Kiểm tra các bàn có ca đặt sắp tới trong vòng 60 phút
                const upcomingAlertTables = [];

                tables.forEach(t => {
                    const tableResList = allReservationsData.filter(r => 
                        r.tableId === t.id && 
                        r.status !== 'CANCELLED' && 
                        r.status !== 'COMPLETED'
                    );
                    tableResList.forEach(r => {
                        if (r.reservationDate === todayStr && r.startTime) {
                            const [h, m] = r.startTime.split(':').map(Number);
                            const resMin = h * 60 + m;
                            const diff = resMin - currentMinutes;
                            // Sắp tới giờ trong vòng 60 phút hoặc đang trong khung giờ hẹn (đến trễ <= 30 phút)
                            if (diff >= -30 && diff <= 60) {
                                upcomingAlertTables.push({
                                    tableId: t.id,
                                    tableName: t.tableName || ('Bàn ' + t.id),
                                    customerName: r.customerName || 'Khách đặt trước',
                                    time: r.startTime,
                                    diff: diff,
                                    status: t.status
                                });
                            }
                        }
                    });
                });

                // 1. Hiển thị thông báo Banner cảnh báo trên đầu nếu có bàn sắp đến giờ khách hẹn
                const alertContainer = document.getElementById('reservation-alert-container');
                if (alertContainer) {
                    if (upcomingAlertTables.length > 0) {
                        alertContainer.innerHTML = `
                            <div class="alert alert-warning" style="background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%); border: 1px solid #ffeeba; border-left: 5px solid #ff9800; border-radius: 8px; padding: 12px 18px; margin-bottom: 20px; box-shadow: 0 3px 10px rgba(255,152,0,0.18);">
                                <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                                    <div style="color: #856404; font-size: 14px;">
                                        <strong style="color: #d97706; font-size: 15px;"><i class="fa fa-bell"></i> CẢNH BÁO CA ĐẶT SẮP ĐẾN GIỜ:</strong>
                                        <span> Có <b>${upcomingAlertTables.length} bàn</b> sắp đến giờ khách đặt: </span>
                                        ${upcomingAlertTables.map(u => `<span class="badge" style="background:#ff9800; color:#fff; font-size:12px; margin: 2px 4px; padding: 4px 8px;">${escapeHtml(u.tableName)} lúc ${u.time.slice(0,5)} (${escapeHtml(u.customerName)})</span>`).join('')}
                                        <div style="font-size: 12px; color: #b45309; margin-top: 4px;">👉 <i>Nhân viên lưu ý giữ bàn trống và sắp xếp ca trước hợp lý, tránh trùng khách!</i></div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        alertContainer.innerHTML = '';
                    }
                }
                
                const container = document.getElementById('tables-container');
                let html = '';
                
                tables.forEach(t => {
                    const activeOrder = activeOrders.find(o => o.tableId === t.id);
                    // Lấy tất cả ca đặt sau của bàn này
                    const tableReservations = allReservationsData.filter(r => 
                        r.tableId === t.id && 
                        r.status !== 'CANCELLED' && 
                        r.status !== 'COMPLETED'
                    );
                    tableReservations.sort((a, b) => ((a.reservationDate || '') + ' ' + (a.startTime || '')).localeCompare((b.reservationDate || '') + ' ' + (b.startTime || '')));
                    const activeRes = tableReservations[0];
                    const activeResId = activeRes ? activeRes.id : null;

                    // Tìm ca đặt cần giữ bàn (trong vòng 60 phút tính tới giờ hẹn hoặc đang trong khung giờ hẹn)
                    let holdingRes = null;
                    tableReservations.forEach(r => {
                        if (r.reservationDate === todayStr && r.startTime) {
                            const [h, m] = r.startTime.split(':').map(Number);
                            const resMin = h * 60 + m;
                            const diff = resMin - currentMinutes;
                            let endMin = resMin + 120;
                            if (r.endTime) {
                                const [eh, em] = r.endTime.split(':').map(Number);
                                endMin = eh * 60 + em;
                            }
                            if (diff <= 60 && currentMinutes <= endMin) {
                                if (!holdingRes || diff < holdingRes.diff) {
                                    holdingRes = { ...r, diff: diff };
                                }
                            }
                        }
                    });

                    const rawName = String(t.tableName || t.name || t.id).trim();
                    const displayName = rawName.toLowerCase().startsWith('bàn') ? rawName : ('Bàn ' + rawName);

                    if (activeOrder) {
                        // Tự động đồng bộ lại trạng thái DB thành OCCUPIED nếu bàn có đơn mà DB bị lệch
                        if (t.status !== 'OCCUPIED') {
                            fetchWithAuth(`/tables/${t.id}/status`, {
                                method: 'PATCH',
                                body: JSON.stringify({ status: 'OCCUPIED' })
                            }).catch(e => console.warn(e));
                        }

                        // BÀN ĐANG PHỤC VỤ (CÓ KHÁCH ĐANG DÙNG BỮA)
                        html += `
                        <div class="col-md-3 col-sm-4 col-xs-6" style="margin-bottom: 20px;">
                            <div class="table-card table-occupied" style="position: relative; min-height: 200px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between;" onclick="openOrder(${t.id}, ${activeOrder.id})">
                                <!-- Top buttons -->
                                <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 4px;">
                                    <button onclick="openPosSwitchTableModal(event, ${activeOrder.id}, ${t.id}, '${escapeHtml(displayName)}')" class="btn btn-default btn-xs" style="font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 4px; background: #fff; border: 1px solid #d97706; color: #d97706;" title="Đổi khách và đơn sang bàn khác"><i class="fa fa-exchange"></i> Đổi bàn</button>
                                    ${isCashierOrAdmin ? `
                                        <button onclick="openFutureReservationModal(event, ${t.id}, '${escapeHtml(displayName)}')" class="btn btn-warning btn-xs" style="font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 4px;" title="Chỉ Thu ngân / Quản lý mới được đặt bàn ca sau"><i class="fa fa-calendar-plus-o"></i> Đặt ca sau</button>
                                    ` : '<div></div>'}
                                </div>

                                <!-- Center Info -->
                                <div>
                                    <i class="fa fa-users table-icon" style="color: #d39e00; margin-bottom: 4px;"></i>
                                    <h3 style="margin: 2px 0;">${escapeHtml(displayName)}</h3>
                                    ${activeOrder.status === 'PROCESSING' ? `
                                        <p style="margin: 0; color: #ea580c; font-weight: bold; font-size: 13px;"><i class="fa fa-fire"></i> Bếp đang chế biến</p>
                                    ` : (activeOrder.status === 'SERVED' || activeOrder.status === 'READY') ? `
                                        <p style="margin: 0; color: #16a34a; font-weight: bold; font-size: 13px;"><i class="fa fa-check-circle"></i> Đã lên đủ món</p>
                                    ` : `
                                        <p style="margin: 0; color: #0284c7; font-weight: bold; font-size: 13px;"><i class="fa fa-clock-o"></i> Chờ bếp nhận đơn</p>
                                    `}
                                    <small class="text-muted">Mã ĐH: #${activeOrder.orderCode}</small>
                                    <div style="font-size: 11px; color: #1e40af; background: #eff6ff; border: 1px dashed #93c5fd; border-radius: 4px; padding: 4px 6px; margin: 4px 0; text-align: left; cursor: pointer;" onclick="event.stopPropagation(); viewEditDiningCustomerPos(${activeOrder.id}, '${escapeHtml(displayName)}')" title="Nhấn để xem và sửa thông tin khách ăn">
                                        <div style="display:flex; justify-content:space-between; align-items:center;">
                                            <span><i class="fa fa-user"></i> <b>${escapeHtml(activeOrder.customerName || 'Khách vãng lai')}</b></span>
                                            ${activeOrder.visitCount ? `<span class="badge" style="background:#0284c7; font-size:9px;">Ghé ${activeOrder.visitCount} lần</span>` : ''}
                                        </div>
                                        ${activeOrder.customerPhone && activeOrder.customerPhone !== '0000000000' ? `<div style="font-size:10px; color:#64748b;"><i class="fa fa-phone"></i> ${escapeHtml(activeOrder.customerPhone)}</div>` : ''}
                                        <div style="font-size: 10px; color: #0284c7; margin-top: 1px;"><i class="fa fa-pencil"></i> Xem & sửa thông tin khách</div>
                                    </div>
                                </div>

                                <!-- Bottom status & ca sau -->
                                <div style="margin-top: 6px; width: 100%;">
                                    ${tableReservations.length > 0 ? (
                                        isCashierOrAdmin ? `
                                            <button onclick="viewFutureReservations(event, ${t.id}, '${escapeHtml(displayName)}')" class="btn btn-info btn-xs" style="font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 4px; background-color:#0284c7; border:none; width: 100%;" title="Xem chi tiết các ca đặt tiếp theo"><i class="fa fa-clock-o"></i> Xem ca sau (${tableReservations.length})</button>
                                        ` : `
                                            <span class="badge" style="font-size: 10px; background-color: #0284c7; color: white; display: block; padding: 3px 6px;"><i class="fa fa-clock-o"></i> Có ca sau (${tableReservations.length})</span>
                                        `
                                    ) : ''}

                                    ${holdingRes ? `
                                        <div style="margin-top: 4px; padding: 3px 6px; background: #fee2e2; border: 1px solid #f87171; border-radius: 4px; color: #dc2626; font-size: 11px; font-weight: bold;">
                                            🔥 Ca sau: ${holdingRes.startTime.slice(0,5)} (còn ~${Math.max(0, holdingRes.diff)}p)
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>`;
                    } else if (holdingRes) {

        window.openTableForReservedGuest = async function(tableId, tableName, reservationId, customerName, customerPhone, startTime, resNote) {
            try {
                // 1. Check-in khách hàng
                const cusRes = await fetchWithAuth('/customers/check-in', {
                    method: 'POST',
                    body: JSON.stringify({ fullName: customerName || 'Khách đặt trước', phone: customerPhone || '0000000000' })
                });
                let customerId = cusRes && cusRes.data ? cusRes.data.id : null;
                if (!customerId) {
                    try {
                        const walkInRes = await fetchWithAuth('/customers/by-phone/0000000000');
                        if (walkInRes && walkInRes.data) customerId = walkInRes.data.id;
                    } catch(e) {}
                }
                if (!customerId) customerId = 1;

                // 2. Chuyển trạng thái bàn sang OCCUPIED
                await fetchWithAuth(`/tables/${tableId}/status`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status: 'OCCUPIED' })
                });

                // 3. Nếu có reservationId, cập nhật sang COMPLETED
                if (reservationId && reservationId !== 'null') {
                    await fetchWithAuth(`/reservations/${reservationId}/status?status=COMPLETED`, {
                        method: 'PUT'
                    }).catch(e => console.warn(e));
                }

                // 4. Tạo Order
                const userId = localStorage.getItem('userId') || 1;
                const orderCode = 'ORD' + Date.now().toString().slice(-6);
                let orderNote = `Khách đặt trước lúc ${startTime}`;
                if (resNote) orderNote += ` | ${resNote}`;

                const ordRes = await fetchWithAuth('/orders/add', {
                    method: 'POST',
                    body: JSON.stringify({
                        orderCode: orderCode,
                        tableId: tableId,
                        customerId: customerId,
                        userId: parseInt(userId),
                        note: orderNote
                    })
                });

                const newOrder = ordRes.data;
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: `Đã mở bàn đón ${customerName}!`,
                    showConfirmButton: false,
                    timer: 1500
                });

                setTimeout(() => {
                    window.location.href = `/order?tableId=${tableId}&orderId=${newOrder ? newOrder.id : ''}`;
                }, 400);

            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi mở bàn đón khách',
                    text: err.message
                });
            }
        };

        window.openForWalkInGuest = function(tableId, tableName) {
            createNewOrder(tableId, tableName);
        };

            } catch(err) {

            }
        };

        // CHUYỂN CA HẸN ĐẶT TRƯỚC SANG BÀN KHÁC (ĐIỀU PHỐI KHÁCH HẸN TRÁNH BÀN ĐANG ĂN)
        window.switchReservationTable = async function(reservationId, currentTableId, currentTableName, customerName) {
            if (!reservationId || reservationId === 'null') {
                Swal.fire({ icon: 'warning', title: 'Không tìm thấy ca đặt', text: 'Không có mã ca đặt để chuyển bàn!' });
                return;
            }

            try {
                const tableRes = await fetchWithAuth('/tables');
                const allTables = tableRes.data || [];
                const emptyTables = allTables.filter(t => t.id !== currentTableId && t.status !== 'OCCUPIED');

                if (emptyTables.length === 0) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Không có bàn trống',
                        text: 'Hiện không có bàn nào đang trống để chuyển ca đặt sang!',
                        confirmButtonColor: '#ff9800'
                    });
                    return;
                }

                const inputOptions = {};
                emptyTables.forEach(t => {
                    const rawName = String(t.tableName || t.name || t.id).trim();
                    const name = rawName.toLowerCase().startsWith('bàn') ? rawName : ('Bàn ' + rawName);
                    inputOptions[t.id] = `${name} (${t.capacity || 4} chỗ - ${t.status === 'RESERVED' ? 'Đã đặt' : 'Bàn trống'})`;
                });

                const { value: newTableId } = await Swal.fire({
                    title: `🔄 Chuyển Ca Đặt Sang Bàn Khác`,
                    html: `Chuyển ca hẹn của khách <b>${customerName || 'Khách đặt'}</b> từ <b>${currentTableName}</b> sang bàn trống mới:`,
                    input: 'select',
                    inputOptions: inputOptions,
                    inputPlaceholder: '-- Chọn bàn chuyển sang --',
                    showCancelButton: true,
                    confirmButtonText: '<i class="fa fa-check"></i> Xác nhận chuyển bàn',
                    cancelButtonText: 'Hủy bỏ',
                    confirmButtonColor: '#0284c7',
                    inputValidator: (value) => {
                        if (!value) return 'Vui lòng chọn bàn muốn chuyển sang!';
                    }
                });

                if (newTableId) {
                    await fetchWithAuth(`/reservations/${reservationId}/switch-table/${newTableId}`, {
                        method: 'PUT'
                    });

                    await Swal.fire({
                        icon: 'success',
                        title: 'Chuyển bàn thành công! 🎉',
                        html: `Đã chuyển ca đặt của <b>${customerName || 'khách'}</b> sang bàn mới!<br>Bàn <b>${currentTableName}</b> đã được giải phóng ca hẹn.`,
                        confirmButtonColor: '#28a745',
                        timer: 2000
                    });

                    loadTables();
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi chuyển ca đặt',
                    text: err.message,
                    confirmButtonColor: '#d33'
                });
            }
        };

        window.cancelReservation = async function(e, tableId, orderId, resId) {
            if (e && e.stopPropagation) e.stopPropagation();
            const res = await Swal.fire({
                title: 'Hủy đặt trước?',
                text: 'Bạn có chắc chắn muốn HỦY đặt trước bàn này không? Bàn sẽ trở về trạng thái trống.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: '<i class="fa fa-trash"></i> Đồng ý hủy',
                cancelButtonText: 'Quay lại',
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d'
            });
            if(!res.isConfirmed) return;
            
            try {
                if (orderId && orderId !== 'null' && orderId !== 'undefined') {
                    await fetchWithAuth(`/orders/${orderId}/status?status=CANCELLED`, { method: 'PUT' }).catch(e => console.warn(e));
                }

                let targetResIds = [];
                if (resId && resId !== 'null' && resId !== 'undefined') {
                    targetResIds.push(resId);
                } else {
                    const matched = (allReservationsData || []).filter(r => 
                        r.tableId === tableId && 
                        r.status !== 'CANCELLED' && 
                        r.status !== 'COMPLETED'
                    );
                    matched.forEach(r => targetResIds.push(r.id));
                }

                if (targetResIds.length === 0) {
                    try {
                        const tableRes = await fetchWithAuth(`/reservations/table/${tableId}`);
                        const rList = tableRes.data || [];
                        rList.filter(r => r.status !== 'CANCELLED' && r.status !== 'COMPLETED').forEach(r => {
                            if (!targetResIds.includes(r.id)) targetResIds.push(r.id);
                        });
                    } catch(e) {
                        console.warn('Cannot fetch reservations for table', e);
                    }
                }

                for (const rid of targetResIds) {
                    await fetchWithAuth(`/reservations/${rid}`, { method: 'DELETE' });
                }

                await fetchWithAuth(`/tables/${tableId}/status`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status: 'AVAILABLE' })
                }).catch(e => console.warn(e));

                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Đã hủy đặt bàn thành công',
                    showConfirmButton: false,
                    timer: 1500
                });
                loadTables();
            } catch(err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi hủy đặt bàn',
                    text: err.message,
                    confirmButtonColor: '#d10024'
                });
            }
        };

                    }
                }
                if (!isCurrentlyOccupied) {
                    const targetStatus = isWithin60 ? 'RESERVED' : 'AVAILABLE';
                    await fetchWithAuth(`/tables/${tableId}/status`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: targetStatus })
                    }).catch(e => console.warn(e));
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Đặt bàn thành công!',
                    html: `Đã đặt trước <b>${displayName}</b> cho khách <b>${formValues.name}</b> vào lúc <b>${formValues.start.slice(0,5)} - ${formValues.end.slice(0,5)}</b> ngày <b>${formValues.date}</b>.<br><br><small class="text-muted">Bàn vẫn mở đón khách bình thường trước khung giờ này.</small>`,
                    confirmButtonColor: '#28a745'
                });

                loadTables();
            } catch(err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Đặt bàn thất bại',
                    text: err.message,
                    confirmButtonColor: '#d33'
                });
            }
        };

        let posLookupTimeout = null;
        window.lookupCustomerByPhonePos = function(phone, nameInputId, feedbackElemId) {
            if (posLookupTimeout) clearTimeout(posLookupTimeout);
            const feedbackElem = document.getElementById(feedbackElemId);
            if (!phone || phone.trim().length < 8) {
                if (feedbackElem) feedbackElem.innerHTML = '';
                return;
            }
            const cleanPhone = phone.trim();
            if (cleanPhone === '0000000000') {
                if (feedbackElem) feedbackElem.innerHTML = '';
                return;
            }

            posLookupTimeout = setTimeout(async () => {
                try {
                    if (feedbackElem) feedbackElem.innerHTML = '<span style="color:#6c757d; font-size:12px;"><i class="fa fa-spinner fa-spin"></i> Đang tra cứu thông tin khách...</span>';
                    const res = await fetchWithAuth(`/customers/by-phone/${cleanPhone}`);
                    const customer = res.data;
                    if (customer && customer.fullName) {
                        const nameInput = document.getElementById(nameInputId);
                        if (nameInput && (!nameInput.value || nameInput.value === 'Khách vãng lai' || nameInput.value.trim() === '')) {
                            nameInput.value = customer.fullName;
                        }
                        const visits = customer.visitCount || 1;
                        if (feedbackElem) {
                            feedbackElem.innerHTML = `
                                <div style="background: #e6fffa; border: 1px solid #38b2ac; color: #234e52; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: 4px;">
                                    <i class="fa fa-star" style="color: #d69e2e;"></i> <b>Khách quen!</b> Đã ghé quán <b>${visits}</b> lần • Tên: <b>${escapeHtml(customer.fullName)}</b>
                                </div>`;
                        }
                    } else {
                        if (feedbackElem) {
                            feedbackElem.innerHTML = `
                                <div style="background: #ebf8ff; border: 1px solid #63b3ed; color: #2b6cb0; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: 4px;">
                                    <i class="fa fa-info-circle"></i> <b>Khách mới</b> ghé lần đầu
                                </div>`;
                        }
                    }
                } catch (err) {
                    if (feedbackElem) feedbackElem.innerHTML = '';
                }
            }, 300);
        };

        window.viewEditDiningCustomerPos = async function(orderId, tableName) {
            if (!orderId) {
                Swal.fire({ icon: 'warning', title: 'Thông báo', text: 'Bàn này chưa có đơn hàng nào!' });
                return;
            }
            try {
                const ordRes = await fetchWithAuth(`/orders/${orderId}`);
                const order = ordRes.data;
                if (!order) throw new Error("Không tìm thấy thông tin đơn hàng!");

                let customer = null;
                if (order.customerId) {
                    try {
                        const cusRes = await fetchWithAuth(`/customers/${order.customerId}`);
                        customer = cusRes.data;
                    } catch(e) {}
                }

                const cusName = (customer ? customer.fullName : order.customerName) || 'Khách vãng lai';
                const cusPhone = (customer ? customer.phone : order.customerPhone) || '';
                const visits = customer && customer.visitCount ? customer.visitCount : (order.visitCount || 1);
                const visitBadge = (cusPhone && cusPhone !== '0000000000' && visits > 1)
                    ? `<span class="badge" style="background: #10b981; color: #fff; padding: 5px 8px; font-size:12px;"><i class="fa fa-star"></i> Khách quen! Đã ghé ${visits} lần</span>`
                    : `<span class="badge" style="background: #0ea5e9; color: #fff; padding: 5px 8px; font-size:12px;"><i class="fa fa-user"></i> Khách mới ghé lần đầu</span>`;

                const { value: formValues } = await Swal.fire({
                    title: `<div style="font-size:19px; font-weight:bold; color:#0284c7;"><i class="fa fa-user"></i> Thông Tin Khách Đang Ăn - ${escapeHtml(tableName)}</div>`,
                    html: `
                        <div style="text-align: left; font-size: 14px;">
                            <div style="background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 10px; margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-weight:bold; color:#0369a1;">Mã đơn: #${order.orderCode || order.id}</div>
                                    <div style="font-size:12px; color:#64748b;">Bàn: ${escapeHtml(tableName)}</div>
                                </div>
                                <div>${visitBadge}</div>
                            </div>

                            <div class="form-group" style="margin-bottom:10px;">
                                <label style="font-weight:bold; margin-bottom:2px;">Số điện thoại khách hàng</label>
                                <input id="swal-edit-cus-phone" class="form-control input-sm" value="${escapeHtml(cusPhone === '0000000000' ? '' : cusPhone)}" placeholder="Ví dụ: 0987654321">
                                <div id="swal-edit-cus-phone-feedback" style="margin-top:4px;"></div>
                            </div>

                            <div class="form-group" style="margin-bottom:10px;">
                                <label style="font-weight:bold; margin-bottom:2px;">Tên khách hàng <span class="text-danger">*</span></label>
                                <input id="swal-edit-cus-name" class="form-control input-sm" value="${escapeHtml(cusName)}" placeholder="Nhập tên khách hàng">
                            </div>

                            <div class="form-group" style="margin-bottom:10px;">
                                <label style="font-weight:bold; margin-bottom:2px;">Ghi chú đơn hàng / Yêu cầu riêng</label>
                                <input id="swal-edit-order-note" class="form-control input-sm" value="${escapeHtml(order.note || '')}" placeholder="Ghi chú món, sở thích, cọc...">
                            </div>
                        </div>
                    `,
                    didOpen: () => {
                        const phoneInput = document.getElementById('swal-edit-cus-phone');
                        if (phoneInput) {
                            phoneInput.addEventListener('input', () => {
                                window.lookupCustomerByPhonePos(phoneInput.value, 'swal-edit-cus-name', 'swal-edit-cus-phone-feedback');
                            });
                        }
                    },
                    showCancelButton: true,
                    confirmButtonText: '<i class="fa fa-save"></i> Lưu thông tin',
                    cancelButtonText: 'Đóng',
                    confirmButtonColor: '#0284c7',
                    preConfirm: () => {
                        const name = (document.getElementById('swal-edit-cus-name').value || '').trim();
                        const phone = (document.getElementById('swal-edit-cus-phone').value || '').trim() || '0000000000';
                        const note = (document.getElementById('swal-edit-order-note').value || '').trim();
                        if (!name) {
                            Swal.showValidationMessage('Tên khách hàng không được để trống!');
                            return false;
                        }
                        return { name, phone, note };
                    }
                });

                if (!formValues) return;

                // Check-in thông tin khách hàng mới hoặc cập nhật
                const cusRes = await fetchWithAuth('/customers/check-in', {
                    method: 'POST',
                    body: JSON.stringify({ fullName: formValues.name, phone: formValues.phone })
                });
                const newCustomer = cusRes.data;
                if (newCustomer && newCustomer.id) {
                    await fetchWithAuth(`/orders/${orderId}/customer/${newCustomer.id}`, {
                        method: 'PUT'
                    }).catch(e => console.warn(e));
                }

                await fetchWithAuth(`/orders/${orderId}/note`, {
                    method: 'PUT',
                    body: JSON.stringify({ note: formValues.note })
                });

                Swal.fire({
                    icon: 'success',
                    title: 'Cập nhật thành công! 🎉',
                    text: `Đã lưu thông tin khách ăn cho ${tableName}`,
                    timer: 1500,
                    showConfirmButton: false
                });

                loadTables();
            } catch(err) {
                Swal.fire({ icon: 'error', title: 'Lỗi cập nhật', text: err.message, confirmButtonColor: '#d33' });
            }
        };

        window.viewEditReservedCustomerPos = async function(reservationId, tableName, tableId) {
            let resId = (reservationId && reservationId !== 'null') ? parseInt(reservationId) : null;
            let targetTableId = tableId ? parseInt(tableId) : null;

            if (!resId && targetTableId) {
                const found = (allReservationsData || []).find(r => r.tableId === targetTableId && r.status !== 'CANCELLED' && r.status !== 'COMPLETED');
                if (found) resId = found.id;
            }

            if (!resId) {
                try {
                    const resRes = await fetchWithAuth('/reservations/all');
                    allReservationsData = resRes.data || [];
                    const checkId = targetTableId || (reservationId ? parseInt(reservationId) : null);
                    if (checkId) {
                        const found = allReservationsData.find(r => (r.tableId === checkId || r.id === checkId) && r.status !== 'CANCELLED' && r.status !== 'COMPLETED');
                        if (found) resId = found.id;
                    }
                } catch(e) {}
            }

            if (!resId) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Chưa có thông tin ca đặt',
                    text: `Bàn ${tableName} hiện không tìm thấy ca đặt trước nào!`,
                    confirmButtonColor: '#ff9800'
                });
                return;
            }

            return window.openEditReservationPosById(resId, tableName);
        };

        window.openEditReservationPosById = async function(reservationId, tableName) {
            if (!reservationId || reservationId === 'null') {
                Swal.fire({ icon: 'warning', title: 'Thông báo', text: 'Không tìm thấy ca đặt bàn này!' });
                return;
            }
            try {
                let res = null;
                const parsedId = parseInt(reservationId);
                try {
                    const resvRes = await fetchWithAuth(`/reservations/${parsedId}`);
                    res = resvRes.data;
                } catch(fetchErr) {
                    try {
                        const allResRes = await fetchWithAuth('/reservations/all');
                        allReservationsData = allResRes.data || [];
                        const found = allReservationsData.find(r => (r.id === parsedId || r.tableId === parsedId) && r.status !== 'CANCELLED' && r.status !== 'COMPLETED');
                        if (found) {
                            res = found;
                        } else {
                            throw fetchErr;
                        }
                    } catch(e2) {
                        throw fetchErr;
                    }
                }

                if (!res) throw new Error("Không tìm thấy thông tin ca đặt!");

                let customer = null;
                if (res.customerId) {
                    try {
                        const cusRes = await fetchWithAuth(`/customers/${res.customerId}`);
                        customer = cusRes.data;
                    } catch(e) {}
                }

                const cusName = (customer ? customer.fullName : res.customerName) || 'Khách đặt';
                const cusPhone = (customer ? customer.phone : res.customerPhone) || '';
                const visits = customer && customer.visitCount ? customer.visitCount : (res.visitCount || 1);
                const visitBadge = (cusPhone && cusPhone !== '0000000000' && visits > 1)
                    ? `<span class="badge" style="background:#10b981; color:#fff; padding:5px 8px; font-size:12px;"><i class="fa fa-star"></i> Khách quen! Đã ghé ${visits} lần</span>`
                    : `<span class="badge" style="background:#0ea5e9; color:#fff; padding:5px 8px; font-size:12px;"><i class="fa fa-user"></i> Khách mới đặt lần đầu</span>`;

                const { value: formValues } = await Swal.fire({
                    title: `<div style="font-size:19px; font-weight:bold; color:#b45309;"><i class="fa fa-calendar-check-o"></i> Thông Tin Khách Đặt - ${escapeHtml(tableName)}</div>`,
                    html: `
                        <div style="text-align: left; font-size: 14px;">
                            <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px; margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-weight:bold; color:#92400e;">Mã đặt: #${res.reservationCode}</div>
                                    <div style="font-size:12px; color:#6b7280;">Bàn: ${escapeHtml(tableName)}</div>
                                </div>
                                <div>${visitBadge}</div>
                            </div>

                            <div class="form-group" style="margin-bottom:8px;">
                                <label style="font-weight:bold; margin-bottom:2px;">Tên khách hàng <span class="text-danger">*</span></label>
                                <input id="swal-edit-res-name" class="form-control input-sm" value="${escapeHtml(cusName)}" placeholder="Nhập tên khách hàng">
                            </div>
                            <div class="form-group" style="margin-bottom:8px;">
                                <label style="font-weight:bold; margin-bottom:2px;">Số điện thoại <span class="text-danger">*</span></label>
                                <input id="swal-edit-res-phone" class="form-control input-sm" value="${escapeHtml(cusPhone === '0000000000' ? '' : cusPhone)}" placeholder="Nhập số điện thoại">
                                <div id="swal-edit-res-phone-feedback" style="margin-top:4px;"></div>
                            </div>
                            <div class="row" style="margin:0 -5px 8px -5px;">
                                <div class="col-xs-6" style="padding:0 5px;">
                                    <label style="font-weight:bold; margin-bottom:2px;">Ngày đặt <span class="text-danger">*</span></label>
                                    <input id="swal-edit-res-date" type="date" class="form-control input-sm" value="${res.reservationDate}">
                                </div>
                                <div class="col-xs-6" style="padding:0 5px;">
                                    <label style="font-weight:bold; margin-bottom:2px;">Số khách</label>
                                    <input id="swal-edit-res-guests" type="number" min="1" class="form-control input-sm" value="${res.numberOfGuests || 4}">
                                </div>
                            </div>
                            <div class="row" style="margin:0 -5px 8px -5px;">
                                <div class="col-xs-6" style="padding:0 5px;">
                                    <label style="font-weight:bold; margin-bottom:2px;">Giờ bắt đầu <span class="text-danger">*</span></label>
                                    <input id="swal-edit-res-start" type="time" class="form-control input-sm" value="${(res.startTime || '').slice(0,5)}">
                                </div>
                                <div class="col-xs-6" style="padding:0 5px;">
                                    <label style="font-weight:bold; margin-bottom:2px;">Giờ kết thúc <span class="text-danger">*</span></label>
                                    <input id="swal-edit-res-end" type="time" class="form-control input-sm" value="${(res.endTime || '').slice(0,5)}">
                                </div>
                            </div>
                            <div class="form-group" style="margin-bottom:8px;">
                                <label style="font-weight:bold; margin-bottom:2px;">Ghi chú / Tiền cọc</label>
                                <input id="swal-edit-res-note" class="form-control input-sm" value="${escapeHtml(res.note || '')}" placeholder="Ghi chú yêu cầu riêng của khách...">
                            </div>
                        </div>
                    `,
                    didOpen: () => {
                        const phoneInput = document.getElementById('swal-edit-res-phone');
                        if (phoneInput) {
                            phoneInput.addEventListener('input', () => {
                                window.lookupCustomerByPhonePos(phoneInput.value, 'swal-edit-res-name', 'swal-edit-res-phone-feedback');
                            });
                        }
                    },
                    showCancelButton: true,
                    confirmButtonText: '<i class="fa fa-save"></i> Lưu cập nhật',
                    cancelButtonText: 'Đóng',
                    confirmButtonColor: '#b45309',
                    preConfirm: () => {
                        const name = (document.getElementById('swal-edit-res-name').value || '').trim();
                        const phone = (document.getElementById('swal-edit-res-phone').value || '').trim();
                        const date = document.getElementById('swal-edit-res-date').value;
                        const start = document.getElementById('swal-edit-res-start').value;
                        const end = document.getElementById('swal-edit-res-end').value;
                        const guests = parseInt(document.getElementById('swal-edit-res-guests').value) || 4;
                        const note = (document.getElementById('swal-edit-res-note').value || '').trim();

                        if (!name || !phone) {
                            Swal.showValidationMessage('Vui lòng nhập tên và số điện thoại khách!');
                            return false;
                        }
                        if (!date || !start || !end) {
                            Swal.showValidationMessage('Vui lòng chọn ngày và giờ đặt!');
                            return false;
                        }
                        if (start >= end) {
                            Swal.showValidationMessage('Giờ kết thúc phải sau giờ bắt đầu!');
                            return false;
                        }
                        return { name, phone, date, start: start.length === 5 ? start + ':00' : start, end: end.length === 5 ? end + ':00' : end, guests, note };
                    }
                });

                if (!formValues) return;

                if (res.customerId) {
                    await fetchWithAuth(`/customers/${res.customerId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ fullName: formValues.name, phone: formValues.phone })
                    });
                }

                await fetchWithAuth(`/reservations/${res.id}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        reservationCode: res.reservationCode,
                        customerId: res.customerId,
                        tableId: res.tableId,
                        reservationDate: formValues.date,
                        startTime: formValues.start,
                        endTime: formValues.end,
                        numberOfGuests: formValues.guests,
                        note: formValues.note
                    })
                });

                Swal.fire({
                    icon: 'success',
                    title: 'Cập nhật thành công! 🎉',
                    text: `Đã lưu thông tin ca đặt của khách ${formValues.name}`,
                    timer: 1500,
                    showConfirmButton: false
                });

                loadTables();

            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Lỗi cập nhật', text: err.message, confirmButtonColor: '#d33' });
            }
        };

        let previousOrderStatuses = {};
        document.addEventListener('DOMContentLoaded', () => {
            setupAuthUI();
            loadTables();

            const posPhoneInput = document.getElementById('customerPhone');
            if (posPhoneInput) {
                posPhoneInput.addEventListener('input', () => {
                    window.lookupCustomerByPhonePos(posPhoneInput.value, 'customerName', 'customerPhoneFeedback');
                });
            }

            // Tự động đồng bộ trạng thái Bếp thời gian thực mỗi 5 giây
            setInterval(async () => {
                if ($('.modal.in').length || Swal.isVisible()) return;

                try {
                    const ordRes = await fetchWithAuth('/orders/all');
                    const allOrders = ordRes.data || [];
                    const activeOrders = allOrders.filter(o => o.status !== 'COMPLETED' && o.status !== 'CANCELLED');

                    let hasStatusChange = false;
                    for (const ord of activeOrders) {
                        const oldStatus = previousOrderStatuses[ord.id];
                        if (oldStatus === 'PENDING' && ord.status === 'PROCESSING') {
                            const tblName = ord.tableName || ('Bàn ' + ord.tableId);
                            Swal.fire({
                                toast: true,
                                position: 'top-end',
                                icon: 'info',
                                title: `🔥 Bếp đang chế biến món cho [${tblName}]!`,
                                showConfirmButton: false,
                                timer: 3000
                            });
                            hasStatusChange = true;
                        }
                        previousOrderStatuses[ord.id] = ord.status;
                    }

                    // Tải lại sơ đồ bàn khi có thay đổi trạng thái
                    loadTables();
                } catch(e) {}
            }, 5000);
        });
    </script>
</body>
</html>
